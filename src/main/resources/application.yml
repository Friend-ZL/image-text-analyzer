spring:
  application:
    name: image-text-analyzer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:dummy-key-for-test}
      chat:
        options:
          model: qwen-vl-max
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: false
        table-name: vector_store
        schema-name: public
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:analyzer_db}
    username: ${DB_USER:analyzer}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      pool-name: analyzer-pg
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  analysis:
    max-pdf-pages: 10
    max-file-size-mb: 10
    supported-image-types: image/jpeg,image/png,image/gif,image/webp,image/jpg
    supported-file-types: image/jpeg,image/png,image/gif,image/webp,image/jpg,application/pdf
    pdf-render-dpi: 150
  rag:
    chunk-size: 500
    chunk-overlap: 50
    top-k: 3
    similarity-threshold: 0.7
    max-ingest-size-mb: 10
    max-pdf-pages: 50
    chat-model: qwen-plus
    vlm-model: qwen-vl-max
    min-text-length-for-ocr: 50
    embedding-model: text-embedding-v4
    embedding-dimensions: 1024

server:
  port: 8080

logging:
  level:
    com.portfolio.analyzer: INFO
    org.springframework.ai: INFO
    org.flywaydb: INFO
