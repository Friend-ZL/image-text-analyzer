spring:
  application:
    name: image-text-analyzer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  
  # 应用数据源必须是 app_rw，不能是表 owner / Flyway 用户。
  # 角色由 V3 创建；在迁移完成前角色还不存在，所以池不能因为第一次登录失败而中断启动。
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/analyzer_db}
    username: ${DATABASE_USERNAME:app_rw}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 3000
      initialization-fail-timeout: -1
      pool-name: analyzer-pg
  
  # JPA 配置 - 关闭自动 DDL
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Flyway 使用 owner。不单独设置 url，沿用 spring.datasource.url，避免另起库名。
  # appRwPassword 对应 V3 里的 ${appRwPassword}，值来自 DATABASE_APP_RW_PASSWORD，没有默认密码。
  flyway:
    enabled: true
    user: ${DATABASE_FLYWAY_USERNAME:analyzer}
    password: ${DATABASE_FLYWAY_PASSWORD:}
    placeholders:
      appRwPassword: ${DATABASE_APP_RW_PASSWORD:}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  
  # Spring AI pgvector - 关闭自动初始化
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:dummy-key-for-test}
      chat:
        options:
          model: qwen-vl-max
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

app:
  analysis:
    max-pdf-pages: 10
    max-file-size-mb: 10
    supported-image-types: image/jpeg,image/png,image/gif,image/webp,image/jpg
    supported-file-types: image/jpeg,image/png,image/gif,image/webp,image/jpg,application/pdf
    pdf-render-dpi: 150

  rag:
    chunk-size: 500
    chunk-overlap: 50
    top-k: 3
    similarity-threshold: 0.7
    max-ingest-size-mb: 10
    max-pdf-pages: 50
    chat-model: qwen-plus
    vlm-model: qwen-vl-max
    min-text-length-for-ocr: 50
    embedding-model: text-embedding-v4
    embedding-dimensions: 1024
    hnsw-ef-search: 100
  
  # JWT 资源服务器。留空时非 dev/local 启动失败。
  # 不要把这些值写进 spring.security.oauth2.resourceserver.jwt.*：
  # 空字符串也会触发 Boot 的 decoder，并且不会校验 iss/aud。
  security:
    jwt:
      issuer: ${JWT_ISSUER_URI:}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      audience: ${JWT_AUDIENCE:}
      # 读取 resource_access.<client-id>.roles。默认对齐 realm 客户端 image-text-analyzer。
      client-id: ${JWT_CLIENT_ID:image-text-analyzer}
      # Spring Duration。纯数字按秒解析（60 与 60s 都是 60 秒）。负数拒绝启动。
      clock-skew: ${JWT_CLOCK_SKEW_SECONDS:60s}
      claims:
        tenant-id: tenant_id
        roles:
          - realm_access.roles
          - roles
        groups:
          - groups

server:
  port: 8080

logging:
  level:
    com.portfolio.analyzer: INFO
    org.springframework.ai: INFO
    org.flywaydb: INFO
