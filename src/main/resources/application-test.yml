spring:
  ai:
    openai:
      api-key: test-api-key
      base-url: http://127.0.0.1:9

  # 测试默认不连 Postgres。需要真实库的集成测试用 @DynamicPropertySource 覆盖。
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

app:
  analysis:
    max-pdf-pages: 5
    max-file-size-mb: 5
